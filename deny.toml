# Checked by `cargo deny check` in CI (.github/workflows/ci.yml): known
# vulnerabilities in dependencies, their licenses, and where they come from.
# FastEmu is GPL-3.0-or-later, so everything it links must be under a license
# that GPL-3.0 can include: permissive licenses, and file-level copyleft such
# as MPL-2.0. Add a license here only after checking that it fits, and write
# which crate needs it.
#
# Every exception says why it is safe, and where it goes away.

[graph]
all-features = true

[advisories]
# A yanked release is one its authors withdrew for a reason.
yanked = "deny"
# Only crates the workspace depends on directly count as unmaintained. The
# rest arrive with GPUI at the pinned commit of the Zed Android port (chrono,
# the zbus crates, rustybuzz, ttf-parser) and move when that commit moves.
unmaintained = "workspace"
ignore = [
  # quick-xml reads XML only while building: wayland-scanner, xcb and
  # zbus-lockstep-macros turn the protocol files shipped inside those crates
  # into Rust code. No game or user input reaches it. Fixed in quick-xml
  # 0.41, which those crates do not accept yet.
  { id = "RUSTSEC-2026-0194", reason = "build-time XML from the crates' own protocol files" },
  { id = "RUSTSEC-2026-0195", reason = "build-time XML from the crates' own protocol files" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "Unlicense",
  # Data license of the Mozilla root certificate list, if a crate bundles it.
  "CDLA-Permissive-2.0",
  # File-level copyleft: only changes to the crates' own files must be
  # shared, and FastEmu changes none of them.
  "MPL-2.0",
  # FastEmu's own crates, and crates of GPL-3.0 projects that fit it.
  "GPL-3.0-or-later",
]

[bans]
multiple-versions = "allow"
# The workspace's own crates refer to each other by path alone, which
# cargo-deny counts as a wildcard in a crate that could be published.
wildcards = "allow"

[sources]
unknown-registry = "deny"
# GPUI is not on crates.io: it comes from the Zed Android port, pinned to a
# commit in the apps' manifests, with the forks listed below.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# GPUI and the forks Zed builds it with, each pinned to a commit in Cargo.toml
# or by GPUI's own manifest (the Zed Android port's revision).
allow-git = [
  "https://github.com/Dylanmurzello/zed-android-port",
  "https://github.com/gfx-rs/wgpu",
  "https://github.com/zed-industries/async-process.git",
  "https://github.com/zed-industries/async-task.git",
  "https://github.com/zed-industries/calloop",
  "https://github.com/zed-industries/font-kit",
  "https://github.com/zed-industries/khronos-egl",
  "https://github.com/zed-industries/oo7",
  "https://github.com/zed-industries/scap",
  "https://github.com/zed-industries/windows-capture.git",
  "https://github.com/zed-industries/xim-rs.git",
]
