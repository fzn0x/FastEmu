[workspace]
resolver = "3"
members = ["crates/*", "tools/xtask"]
# Plain `cargo build`, `test` and `clippy` cover the emulator itself, which
# builds in seconds. The GPUI apps (fastemu-ui, fastemu, fastemu-android)
# pull in a large dependency tree: build them with `-p fastemu` or
# `--workspace`.
default-members = [
  "crates/fastemu-audio",
  "crates/fastemu-core",
  "crates/fastemu-gfx",
  "crates/fastemu-jvm",
  "crates/fastemu-midp",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
authors = ["The FastEmu contributors"]
repository = "https://github.com/fzn0x/FastEmu"
homepage = "https://fastemu.functionx.dev"

[workspace.dependencies]
fastemu-audio = { path = "crates/fastemu-audio" }
fastemu-core = { path = "crates/fastemu-core" }
fastemu-gfx = { path = "crates/fastemu-gfx" }
fastemu-jvm = { path = "crates/fastemu-jvm" }
fastemu-midp = { path = "crates/fastemu-midp" }
fastemu-ui = { path = "crates/fastemu-ui" }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# Crates that must call platform C APIs (the Android entry point) opt out in
# their own manifests and keep each unsafe block next to a SAFETY comment.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
assert_is_empty = "allow"
# An emulator converts between Java's integer types all the time; these
# casts are deliberate and follow the JVM's own rules.
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
items_after_statements = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
# Panics stay as unwinding: a crash inside one game's virtual machine is
# caught on that instance's threads and must not take the others down.
panic = "unwind"

# GPUI's patches. GPUI comes from the Zed Android port at one commit
# (746f088ee8d6b8b273354826757dd09e74565854), and Zed builds it against
# its own forks of a few crates through [patch.crates-io] in Zed's root
# manifest. Cargo applies only the patches of the workspace being built, so
# FastEmu repeats the ones its dependency graph reaches, with the same
# revisions. Keep this block in step with that commit's root Cargo.toml
# whenever the GPUI revision moves; the Android app relies on it too.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
# Avoids a panic when a failed EGL call reports EGL_SUCCESS (Linux and
# Android GL): https://github.com/timothee-haudebourg/khronos-egl/pull/37
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
