[package]
name = "fastemu-ui"
description = "FastEmu's GPUI views, shared by the desktop and Android apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
fastemu-core = { workspace = true, features = ["serde"] }
futures = "0.3"
# GPUI from the Zed Android port, pinned to one commit so the desktop and
# Android apps build the same GPUI. The platform backends are the apps'
# business: this crate only uses the platform-neutral API.
gpui = { git = "https://github.com/fzn0x/zed-android-port", rev = "04688b1fd8ee697e620cb2933ff599239d0764bf", default-features = false }
# GPUI takes screen pictures as `image` frames; it uses 0.25 too.
image = { version = "0.25", default-features = false }
log = "0.4"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
fastemu-core = { workspace = true, features = ["mock", "serde"] }
gpui = { git = "https://github.com/fzn0x/zed-android-port", rev = "04688b1fd8ee697e620cb2933ff599239d0764bf", default-features = false, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
