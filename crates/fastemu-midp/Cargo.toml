[package]
name = "fastemu-midp"
description = "MIDP 2.0 and the optional Java ME APIs on the FastEmu virtual machine, and the real instance launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
crc32fast = "1.5.0"
fastemu-audio.workspace = true
fastemu-core.workspace = true
fastemu-gfx.workspace = true
fastemu-jvm.workspace = true
miniz_oxide = "0.9.1"
parking_lot = "0.13"
# HTTPS and ssl:// connections: TLS 1.2 and 1.3 in pure Rust, so the same
# code builds for every desktop target and for Android without a C
# toolchain. The roots are Mozilla's list.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.1.0-pre.0"
webpki-roots = "1.0.12"
# The socket options SocketConnection exposes (linger, keep-alive, buffer
# sizes) that std::net does not.
socket2 = "0.6.5"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
