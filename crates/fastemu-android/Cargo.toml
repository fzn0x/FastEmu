[package]
name = "fastemu-android"
description = "The FastEmu Android app's native library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
# Sound through AAudio with cpal; android-activity sets up the
# ndk-context cpal reads.
fastemu-audio = { workspace = true, features = ["output"] }
fastemu-midp.workspace = true
fastemu-ui.workspace = true
futures = "0.3"
# The same GPUI as gpui_android and the desktop app.
gpui = { git = "https://github.com/Dylanmurzello/zed-android-port", rev = "746f088ee8d6b8b273354826757dd09e74565854", default-features = false }
gpui_android = { path = "../gpui_android" }
jni = "0.21"
log = "0.4"

[lints]
workspace = true
