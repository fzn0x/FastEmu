[package]
name = "fastemu-audio"
description = "Sound for FastEmu: a mixer, tone sequences, WAV, MIDI and MP3 playback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Plays the mix through the system's audio device with cpal. Without it the
# engine only renders offline, which is what tests and the headless runner
# need.
output = ["dep:cpal"]

[dependencies]
amr-nb = "0.2.2"
cpal = { version = "0.18.2", optional = true }
parking_lot = "0.13"
rustysynth = "1.3.8"
symphonia-bundle-mp3 = { version = "0.6.1", default-features = false, features = ["mp3"] }
symphonia-core = "0.6.1"

[lints]
workspace = true
