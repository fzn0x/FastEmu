[package]
name = "fastemu-jvm"
description = "A Java virtual machine for Java ME games: class files, interpreter, heap, threads and the CLDC 1.1 library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# The host's time zone for Calendar and TimeZone.getDefault: its rules
# from /usr/share/zoneinfo, Android's tzdata or, on Windows, a bundled
# copy of the tz database.
jiff = { version = "1.0.2", default-features = false, features = [
  "std",
  "tz-system",
  "tzdb-bundle-platform",
  "tzdb-concatenated",
  "tzdb-zoneinfo",
] }
fastemu-core.workspace = true
parking_lot = "0.12"
smallvec = "1"

# High-resolution waitable timers, so sleeps and timed waits do not wake
# on the 15.6 ms system tick.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }

[lints]
workspace = true
