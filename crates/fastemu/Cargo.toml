[package]
name = "fastemu"
description = "FastEmu, a Java ME emulator that runs many games at once in one window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
default-run = "fastemu"

[dependencies]
dirs = "7"
# The runtime is not ready yet: the app runs the mock launcher, whose games
# draw test patterns. The real launcher from fastemu-midp takes its place
# through the same `Launcher` trait.
fastemu-core = { workspace = true, features = ["mock"] }
# The real launcher, for the headless runner (`fastemu run`).
fastemu-midp.workspace = true
fastemu-ui.workspace = true
# GPUI's default features, as Zed builds its desktop app: font-kit, the
# Windows manifest, and both Linux display servers.
gpui = { git = "https://github.com/Dylanmurzello/zed-android-port", rev = "746f088ee8d6b8b273354826757dd09e74565854" }
# The desktop backends: Windows, macOS and Linux with both X11 and Wayland.
gpui_platform = { git = "https://github.com/Dylanmurzello/zed-android-port", rev = "746f088ee8d6b8b273354826757dd09e74565854", default-features = false, features = ["font-kit", "wayland", "x11"] }
# The headless runner's screenshots.
png = "0.18"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# build.rs embeds the icon and the version information in fastemu.exe. The
# version GPUI already builds with for its manifest.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
