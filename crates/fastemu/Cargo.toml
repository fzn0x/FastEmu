[package]
name = "fastemu"
description = "FastEmu, a Java ME emulator that runs many games at once in one window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
default-run = "fastemu"

[dependencies]
dirs = "7"
# Sound through the system's audio device (cpal) for the window; the
# headless runner stays silent.
fastemu-audio = { workspace = true, features = ["output"] }
# The mock launcher's test patterns serve `fastemu --mock`, for working on
# the window without games.
fastemu-core = { workspace = true, features = ["mock"] }
# The real launcher, for the window and the headless runner.
fastemu-midp.workspace = true
fastemu-ui.workspace = true
# GPUI's default features, as Zed builds its desktop app: font-kit, the
# Windows manifest, and both Linux display servers.
gpui = { git = "https://github.com/fzn0x/zed-android-port", rev = "04688b1fd8ee697e620cb2933ff599239d0764bf" }
# The desktop backends: Windows, macOS and Linux with both X11 and Wayland.
gpui_platform = { git = "https://github.com/fzn0x/zed-android-port", rev = "04688b1fd8ee697e620cb2933ff599239d0764bf", default-features = false, features = ["font-kit", "wayland", "x11"] }
# The terminal logger for the window's warnings.
log = "0.4"
# The headless runner's screenshots.
png = "0.18"

# Joining the terminal's console from the GUI program, and Ctrl+C in
# fastemu.com (src/console.rs, src/bin/fastemu-console.rs). The version
# GPUI already builds with.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# build.rs embeds the icon and the version information in fastemu.exe. The
# version GPUI already builds with for its manifest.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
