[package]
name = "xtask"
description = "Repository tasks for FastEmu, run as `cargo xtask`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `cargo xtask stubs`, `coverage` and `compat` read the classes the runtime
# registers, and `compat` runs games with the real launcher.
fastemu-core.workspace = true
fastemu-jvm.workspace = true
fastemu-midp.workspace = true
# The screenshots of `cargo xtask compat`, with the version the app uses.
png = "0.18"
# `cargo xtask icons` renders the app's SVG icon. Only the renderer: the
# icon has no text or embedded images. The version GPUI already builds
# with, so the lockfile gains no second copy.
resvg = { version = "0.49", default-features = false }

[lints]
workspace = true
