name: An idea
description: Suggest something FastEmu could do.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it make easier
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you picture it
  - type: dropdown
    id: where
    attributes:
      label: Where would it apply
      options:
        - All systems
        - Windows
        - Linux
        - macOS
        - Android
        - A Java ME API a game needs
        - Not sure
